<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeus Client — Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <a href="index.html" class="back-link">← На главную</a>
        <div class="logo">ZEUS<span>CLIENT</span></div>
        <h2>Создать аккаунт</h2>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="regUsername" placeholder="Придумайте логин" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="regPassword" placeholder="Придумайте пароль" required>
            </div>
            <button type="submit" class="btn-primary full-width">Продолжить</button>
        </form>

        <p class="auth-footer">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
