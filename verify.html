<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeus Client — Подтверждение Email</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <a href="register.html" class="back-link">← Назад к регистрации</a>
        <div class="logo">ZEUS<span>CLIENT</span></div>
        <h2>Подтверждение Email</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">
            Мы отправили 4-значный код на <strong id="sentEmailDisplay" style="color: var(--accent);">email</strong>
        </p>
        
        <form id="verifyForm">
            <div class="form-group">
                <label>Введите код из письма</label>
                <input type="text" id="verifyCodeInput" maxlength="4" placeholder="X X X X" style="text-align: center; font-size: 1.5rem; letter-spacing: 8px;" required>
            </div>
            <button type="submit" class="btn-primary full-width">Подтвердить и войти</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
