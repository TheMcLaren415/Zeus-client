<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeus Client — Вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <a href="index.html" class="back-link">← На главную</a>
        <div class="logo">ZEUS<span>CLIENT</span></div>
        <h2>Вход в аккаунт</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Логин или Email</label>
                <input type="text" id="loginInput" placeholder="Введите логин" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" placeholder="Введите пароль" required>
            </div>
            <button type="submit" class="btn-primary full-width">Войти</button>
        </form>

        <p class="auth-footer">Ещё нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
